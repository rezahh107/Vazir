name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/runtime-contract.php
      - run: vendor/bin/phpunit

  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer compat

  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.7'
            php: '7.4'
          - wordpress: '7.1'
            php: '8.3'
          - wordpress: '7.1'
            php: '8.5'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: wp-cli
      - name: Install WordPress
        run: |
          mkdir -p /tmp/vazir-wordpress
          wp core download --version=${{ matrix.wordpress }} --path=/tmp/vazir-wordpress --force
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --path=/tmp/vazir-wordpress
          wp core install --url=http://vazir.test --title=Vazir --admin_user=admin --admin_password=admin-password --admin_email=admin@example.test --skip-email --path=/tmp/vazir-wordpress
          ln -s "$GITHUB_WORKSPACE" /tmp/vazir-wordpress/wp-content/plugins/vazir-font-wp
          wp plugin activate vazir-font-wp --path=/tmp/vazir-wordpress
      - name: Run WordPress runtime smoke contract
        run: wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-smoke.php" --path=/tmp/vazir-wordpress

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - theme: twentytwentyone
            block_theme: '0'
          - theme: twentytwentyfive
            block_theme: '1'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install WordPress characterization fixture
        run: |
          mkdir -p /tmp/vazir-wordpress
          wp core download --version=7.1 --path=/tmp/vazir-wordpress --force
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --path=/tmp/vazir-wordpress
          wp core install --url=http://127.0.0.1:8080 --title=Vazir --admin_user=admin --admin_password=admin-password --admin_email=admin@example.test --skip-email --path=/tmp/vazir-wordpress
          ln -s "$GITHUB_WORKSPACE" /tmp/vazir-wordpress/wp-content/plugins/vazir-font-wp
          wp plugin activate vazir-font-wp --path=/tmp/vazir-wordpress
          wp eval 'VazirFontPlugin::update_options(["exclude_selectors" => array_merge(VazirFontPlugin::get_options()["exclude_selectors"], [".vf-excluded-component"])]);' --path=/tmp/vazir-wordpress
          wp theme install ${{ matrix.theme }} --activate --path=/tmp/vazir-wordpress
          cat > /tmp/vazir-post-content.html <<'EOF'
          <!-- wp:heading -->
          <h2 class="wp-block-heading">عنوان فارسی Mixed Heading</h2>
          <!-- /wp:heading -->
          <!-- wp:paragraph -->
          <p>متن فارسی Mixed Latin 123</p>
          <!-- /wp:paragraph -->
          <!-- wp:html -->
          <div class="vf-excluded-component" style="font-family: monospace;"><p id="vf-excluded-text" style="font-family: monospace;">متن استثنا Excluded Typography</p></div>
          <!-- /wp:html -->
          <!-- wp:html -->
          <form id="vf-controls"><input id="vf-input" value="متن"><textarea id="vf-textarea">متن</textarea><select id="vf-select"><option>گزینه</option></select><button id="vf-button" type="button">دکمه</button></form>
          <!-- /wp:html -->
          EOF
          POST_ID=$(wp post create /tmp/vazir-post-content.html --post_type=post --post_status=publish --post_title='Typography Characterization' --porcelain --path=/tmp/vazir-wordpress)
          echo "VAZIR_POST_ID=$POST_ID" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start WordPress web server
        run: |
          wp server --host=127.0.0.1 --port=8080 --path=/tmp/vazir-wordpress > /tmp/vazir-wp-server.log 2>&1 &
          echo $! > /tmp/vazir-wp-server.pid
          curl --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/ >/dev/null
      - name: Run browser computed-style characterization
        env:
          VAZIR_BASE_URL: http://127.0.0.1:8080
          VAZIR_BLOCK_THEME: ${{ matrix.block_theme }}
        run: node tests/browser-characterization.mjs
      - name: Print WordPress server log on failure
        if: failure()
        run: cat /tmp/vazir-wp-server.log || true
