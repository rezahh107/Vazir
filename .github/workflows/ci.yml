name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/runtime-contract.php
      - run: vendor/bin/phpunit

  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer compat

  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.7'
            php: '7.4'
          - wordpress: '7.1'
            php: '8.3'
          - wordpress: '7.1'
            php: '8.5'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: wp-cli
      - name: Install WordPress
        run: |
          mkdir -p /tmp/vazir-wordpress
          wp core download --version=${{ matrix.wordpress }} --path=/tmp/vazir-wordpress --force
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --path=/tmp/vazir-wordpress
          wp core install --url=http://vazir.test --title=Vazir --admin_user=admin --admin_password=admin-password --admin_email=admin@example.test --skip-email --path=/tmp/vazir-wordpress
          ln -s "$GITHUB_WORKSPACE" /tmp/vazir-wordpress/wp-content/plugins/vazir-font-wp
          wp plugin activate vazir-font-wp --path=/tmp/vazir-wordpress
      - name: Run WordPress runtime smoke contract
        run: wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-smoke.php" --path=/tmp/vazir-wordpress
