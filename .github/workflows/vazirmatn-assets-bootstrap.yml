name: Temporary Vazirmatn Migration Builder

on:
  push:
    branches:
      - automation/vazirmatn-assets-bootstrap-20260920

permissions:
  contents: write

jobs:
  construct-migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Construct bounded migration tree
        run: python3 .github/scripts/build-vazirmatn-migration.py
      - name: Run deterministic repository checks
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/runtime-contract.php
          vendor/bin/phpunit
          node tests/product-evidence-lab/core/browser-helpers.test.mjs
          git diff --check -- . ':!assets/fonts/OFL.txt' ':!assets/fonts/AUTHORS.txt'
      - name: Commit constructed migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: migrate bundled typography to Vazirmatn'
          git push origin "HEAD:${GITHUB_REF_NAME}"
