name: Gravity Perks Exact Source Probe

on:
  push:
    branches: [test/gravityperks-2-3-16-qualification]
    paths:
      - '.github/workflows/gravityperks-source-probe.yml'
      - 'tests/product-evidence-lab/core/package-identities.sh'
      - 'tests/product-evidence-lab/core/acquire-packages.sh'
      - 'tests/product-evidence-lab/profiles/gravityperks/source-probe.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: vazir-lab-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pvazir-lab-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      VAZIR_LAB_PROFILE: gravityperks
      VAZIR_LAB_WP_PATH: /tmp/vazir-perks-probe-wordpress
      VAZIR_LAB_PACKAGE_DIR: /tmp/vazir-perks-probe-packages
      VAZIR_LAB_ARTIFACT_DIR: /tmp/vazir-perks-probe-artifacts

    steps:
      - name: Checkout exact probe Head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bind exact Head and reject committed ZIPs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "VAZIR_LAB_REPOSITORY_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          mkdir -p "$VAZIR_LAB_WP_PATH" "$VAZIR_LAB_PACKAGE_DIR" "$VAZIR_LAB_ARTIFACT_DIR"
          if git ls-files '*.zip' | grep -q .; then echo 'Licensed ZIP archives must never be committed.' >&2; exit 1; fi

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli
          tools: wp-cli

      - name: Provision WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          wp core download --version=7.1 --path="$VAZIR_LAB_WP_PATH" --force
          wp config create --dbname=wordpress --dbuser=root --dbpass=vazir-lab-root --dbhost=127.0.0.1:3306 --path="$VAZIR_LAB_WP_PATH" --skip-check
          wp core install --url=http://127.0.0.1:8080 --title='Vazir Gravity Perks Probe' --admin_user=vazir_lab_admin --admin_password=vazir-lab-admin-password --admin_email='vazir-lab@example.invalid' --skip-email --path="$VAZIR_LAB_WP_PATH"
          test "$(wp core version --path="$VAZIR_LAB_WP_PATH")" = '7.1'

      - name: Acquire and verify exact licensed packages
        shell: bash
        run: bash tests/product-evidence-lab/core/acquire-packages.sh gravityperks "$VAZIR_LAB_PACKAGE_DIR" "$VAZIR_LAB_WP_PATH/wp-content/plugins" "$VAZIR_LAB_ARTIFACT_DIR"

      - name: Activate exact Gravity Forms and Gravity Perks
        shell: bash
        run: |
          set -euo pipefail
          wp plugin activate gravityforms gravityperks --path="$VAZIR_LAB_WP_PATH"
          wp plugin status gravityforms --path="$VAZIR_LAB_WP_PATH"
          wp plugin status gravityperks --path="$VAZIR_LAB_WP_PATH"

      - name: Run bounded structural probe
        shell: bash
        run: wp eval-file "$GITHUB_WORKSPACE/tests/product-evidence-lab/profiles/gravityperks/source-probe.php" --use-include --path="$VAZIR_LAB_WP_PATH"

      - name: Assert evidence directory is safe
        id: safety
        if: always()
        shell: bash
        run: bash tests/product-evidence-lab/core/artifact-safety.sh "$VAZIR_LAB_ARTIFACT_DIR"

      - name: Upload bounded probe evidence
        if: ${{ success() && steps.safety.outputs.safe == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vazir-gravityperks-source-probe-${{ github.sha }}
          path: |
            /tmp/vazir-perks-probe-artifacts/**
            !/tmp/vazir-perks-probe-artifacts/**/*.zip
          if-no-files-found: error
          retention-days: 7
